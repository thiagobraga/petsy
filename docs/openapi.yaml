openapi: 3.0.3
info:
  title: Petsy API
  version: 1.0.0
  description: >
    HTTP API for the Petsy pet-care app. This spec is the contract the client
    in `src/api/` codes against. The backend is not implemented yet (the app
    currently uses mock data in `src/data.ts`).
servers:
  - url: http://localhost:3001/api
    description: Local development (default; overridable via REACT_APP_API_URL)

security:
  - bearerAuth: []

tags:
  - name: Pets
  - name: Medicines
  - name: Appointments
  - name: Diary
  - name: Media

paths:
  /pets:
    get:
      tags: [Pets]
      summary: List all pets for the current user
      responses:
        '200':
          description: Array of pets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Pets]
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetCreateInput' }
      responses:
        '201':
          description: Created pet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pets/{petId}:
    parameters:
      - $ref: '#/components/parameters/petId'
    get:
      tags: [Pets]
      summary: Get a pet by id
      responses:
        '200':
          description: Pet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Pets]
      summary: Update a pet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetCreateInput' }
      responses:
        '200':
          description: Updated pet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Pets]
      summary: Delete a pet
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /pets/{petId}/photo:
    parameters:
      - $ref: '#/components/parameters/petId'
    post:
      tags: [Pets]
      summary: Upload a pet photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoData]
              properties:
                photoData: { type: string, description: base64 image }
      responses:
        '200':
          description: Photo URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  photoUrl: { type: string }

  /pets/{petId}/medicines:
    parameters:
      - $ref: '#/components/parameters/petId'
    get:
      tags: [Medicines]
      summary: List a pet's medicines
      responses:
        '200':
          description: Array of medicines
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Medicine' }
    post:
      tags: [Medicines]
      summary: Create a medicine for a pet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MedicineCreateInput' }
      responses:
        '201':
          description: Created medicine
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Medicine' }

  /pets/{petId}/medicines/today:
    parameters:
      - $ref: '#/components/parameters/petId'
    get:
      tags: [Medicines]
      summary: List a pet's medicines scheduled for today
      responses:
        '200':
          description: Array of medicines
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Medicine' }

  /medicines/{medicineId}:
    parameters:
      - $ref: '#/components/parameters/medicineId'
    get:
      tags: [Medicines]
      summary: Get a medicine by id
      responses:
        '200':
          description: Medicine
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Medicine' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Medicines]
      summary: Update a medicine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MedicineCreateInput' }
      responses:
        '200':
          description: Updated medicine
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Medicine' }
    delete:
      tags: [Medicines]
      summary: Delete a medicine
      responses:
        '204': { description: Deleted }

  /medicines/{medicineId}/applied:
    parameters:
      - $ref: '#/components/parameters/medicineId'
    post:
      tags: [Medicines]
      summary: Mark a medicine as applied
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appliedAt]
              properties:
                appliedAt: { type: string, format: date-time }
      responses:
        '200':
          description: Applied timestamp
          content:
            application/json:
              schema:
                type: object
                properties:
                  appliedAt: { type: string, format: date-time }

  /pets/{petId}/appointments:
    parameters:
      - $ref: '#/components/parameters/petId'
    get:
      tags: [Appointments]
      summary: List a pet's appointments
      responses:
        '200':
          description: Array of appointments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Appointment' }
    post:
      tags: [Appointments]
      summary: Create an appointment for a pet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentCreateInput' }
      responses:
        '201':
          description: Created appointment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }

  /pets/{petId}/appointments/upcoming:
    parameters:
      - $ref: '#/components/parameters/petId'
    get:
      tags: [Appointments]
      summary: List a pet's upcoming appointments
      responses:
        '200':
          description: Array of appointments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Appointment' }

  /pets/{petId}/appointments/past:
    parameters:
      - $ref: '#/components/parameters/petId'
    get:
      tags: [Appointments]
      summary: List a pet's past appointments
      responses:
        '200':
          description: Array of appointments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Appointment' }

  /appointments/{appointmentId}:
    parameters:
      - $ref: '#/components/parameters/appointmentId'
    get:
      tags: [Appointments]
      summary: Get an appointment by id
      responses:
        '200':
          description: Appointment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Appointments]
      summary: Update an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentCreateInput' }
      responses:
        '200':
          description: Updated appointment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
    delete:
      tags: [Appointments]
      summary: Delete an appointment
      responses:
        '204': { description: Deleted }

  /pets/{petId}/diary:
    parameters:
      - $ref: '#/components/parameters/petId'
      - name: startDate
        in: query
        required: false
        schema: { type: string, format: date }
      - name: endDate
        in: query
        required: false
        schema: { type: string, format: date }
    get:
      tags: [Diary]
      summary: List a pet's diary entries (optionally filtered by date range)
      responses:
        '200':
          description: Array of diary entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DiaryEntry' }
    post:
      tags: [Diary]
      summary: Create a diary entry for a pet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryEntryCreateInput' }
      responses:
        '201':
          description: Created diary entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryEntry' }

  /diary/{entryId}:
    parameters:
      - $ref: '#/components/parameters/entryId'
    get:
      tags: [Diary]
      summary: Get a diary entry by id
      responses:
        '200':
          description: Diary entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Diary]
      summary: Update a diary entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryEntryCreateInput' }
      responses:
        '200':
          description: Updated diary entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryEntry' }
    delete:
      tags: [Diary]
      summary: Delete a diary entry
      responses:
        '204': { description: Deleted }

  /diary/{entryId}/photos:
    parameters:
      - $ref: '#/components/parameters/entryId'
    post:
      tags: [Diary]
      summary: Add a photo to a diary entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoData]
              properties:
                photoData: { type: string, description: base64 image }
      responses:
        '200':
          description: Photo URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  photoUrl: { type: string }

  /pets/{petId}/media:
    parameters:
      - $ref: '#/components/parameters/petId'
    get:
      tags: [Media]
      summary: List a pet's media items
      responses:
        '200':
          description: Array of media items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MediaItem' }
    post:
      tags: [Media]
      summary: Upload a media item for a pet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaCreateInput' }
      responses:
        '201':
          description: Created media item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaItem' }

  /pets/{petId}/media/albums:
    parameters:
      - $ref: '#/components/parameters/petId'
    get:
      tags: [Media]
      summary: List a pet's album names
      responses:
        '200':
          description: Array of album names
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /pets/{petId}/media/albums/{album}:
    parameters:
      - $ref: '#/components/parameters/petId'
      - name: album
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Media]
      summary: List media items in an album
      responses:
        '200':
          description: Array of media items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MediaItem' }

  /media/{mediaId}:
    parameters:
      - $ref: '#/components/parameters/mediaId'
    get:
      tags: [Media]
      summary: Get a media item by id
      responses:
        '200':
          description: Media item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Media]
      summary: Delete a media item
      responses:
        '204': { description: Deleted }

  /media/{mediaId}/tags:
    parameters:
      - $ref: '#/components/parameters/mediaId'
    post:
      tags: [Media]
      summary: Add tags to a media item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Updated media item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaItem' }
    delete:
      tags: [Media]
      summary: Remove tags from a media item
      parameters:
        - name: tags
          in: query
          required: true
          description: Comma-separated tag list
          schema: { type: string }
      responses:
        '200':
          description: Updated media item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaItem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token read from localStorage `auth_state.token` and sent as
        `Authorization: Bearer <token>` by `src/api/client.ts`.

  parameters:
    petId:
      name: petId
      in: path
      required: true
      schema: { type: string }
    medicineId:
      name: medicineId
      in: path
      required: true
      schema: { type: string }
    appointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: string }
    entryId:
      name: entryId
      in: path
      required: true
      schema: { type: string }
    mediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or expired token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }

    Pet:
      type: object
      required: [id, name, species]
      properties:
        id: { type: string }
        name: { type: string }
        species:
          type: string
          enum: [dog, cat, bird, fish, other]
        breed: { type: string }
        age: { type: number }
        weight: { type: number }
        tone: { type: string }
        image: { type: string }

    PetCreateInput:
      type: object
      required: [name, species]
      properties:
        name: { type: string }
        species:
          type: string
          enum: [dog, cat, bird, fish, other]
        breed: { type: string }
        age: { type: number }
        weight: { type: number }
        tone: { type: string }

    Medicine:
      type: object
      required: [id, petId, name, dosage, frequency, when, days]
      properties:
        id: { type: string }
        petId: { type: string }
        name: { type: string }
        dosage: { type: string }
        frequency: { type: string }
        when:
          type: array
          items: { type: string }
        days:
          type: array
          items: { type: integer }
        status:
          type: string
          enum: [active, inactive]
        notes: { type: string }

    MedicineCreateInput:
      type: object
      required: [petId, name, dosage, frequency, when, days]
      properties:
        petId: { type: string }
        name: { type: string }
        dosage: { type: string }
        frequency: { type: string }
        when:
          type: array
          items: { type: string }
        days:
          type: array
          items: { type: integer }
        notes: { type: string }

    Appointment:
      type: object
      required: [id, petId, title, type, date, status]
      properties:
        id: { type: string }
        petId: { type: string }
        title: { type: string }
        type: { type: string }
        date: { type: string, format: date }
        time: { type: string }
        location: { type: string }
        veterinarian: { type: string }
        notes: { type: string }
        status:
          type: string
          enum: [next, past, cancelled]

    AppointmentCreateInput:
      type: object
      required: [petId, title, type, date]
      properties:
        petId: { type: string }
        title: { type: string }
        type: { type: string }
        date: { type: string, format: date }
        time: { type: string }
        location: { type: string }
        veterinarian: { type: string }
        notes: { type: string }

    DiaryEntry:
      type: object
      required: [id, petId, date, mood, text, createdAt]
      properties:
        id: { type: string }
        petId: { type: string }
        date: { type: string, format: date }
        mood:
          type: string
          enum: [happy, neutral, sad, excited, sick]
        text: { type: string }
        photos:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }

    DiaryEntryCreateInput:
      type: object
      required: [petId, date, mood, text]
      properties:
        petId: { type: string }
        date: { type: string, format: date }
        mood:
          type: string
          enum: [happy, neutral, sad, excited, sick]
        text: { type: string }
        photos:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }

    MediaItem:
      type: object
      required: [id, petId, url, uploadedAt]
      properties:
        id: { type: string }
        petId: { type: string }
        url: { type: string }
        thumbnailUrl: { type: string }
        album: { type: string }
        uploadedAt: { type: string, format: date-time }
        tags:
          type: array
          items: { type: string }

    MediaCreateInput:
      type: object
      required: [petId, photoData]
      properties:
        petId: { type: string }
        photoData: { type: string, description: base64 image }
        album: { type: string }
        tags:
          type: array
          items: { type: string }
